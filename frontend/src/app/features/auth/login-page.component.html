<main class="login-shell" aria-labelledby="page-title">
  <section class="login-panel">
    <p class="eyebrow">Arquitectura - Veterinaria</p>
    <h1 id="page-title">{{ isClient() ? 'Acceso al espacio de cliente' : 'Acceso al espacio de trabajo' }}</h1>
    <p class="context">
      Contexto solicitado: <strong>{{ tenantLabel() }}</strong>
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="email">{{ isClient() ? 'Correo de cliente' : 'Correo institucional' }}</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        formControlName="email"
        [attr.aria-describedby]="form.controls.email.touched && form.controls.email.invalid ? 'email-help' : null"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid ? 'true' : null"
      />
      <small id="email-help" role="alert" *ngIf="form.controls.email.touched && form.controls.email.invalid"
        >Ingresa un correo válido.</small
      >

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        formControlName="password"
        [attr.aria-describedby]="form.controls.password.touched && form.controls.password.invalid ? 'password-help' : null"
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid ? 'true' : null"
      />
      <small
        id="password-help"
        role="alert"
        *ngIf="form.controls.password.touched && form.controls.password.invalid"
        >Ingresa tu contraseña.</small
      >

      <p class="error" role="alert" *ngIf="error()">{{ error() }}</p>
      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Validando acceso…' : 'Ingresar' }}
      </button>
    </form>

    <nav aria-label="Cambiar contexto de demostración">
      <a routerLink="/login/veterinaria-aurora">Aurora</a>
      <a routerLink="/login/veterinaria-bosque">Bosque</a>
      <a [routerLink]="['/client/login', tenantSlug()]">Acceso cliente</a>
    </nav>
  </section>
</main>
