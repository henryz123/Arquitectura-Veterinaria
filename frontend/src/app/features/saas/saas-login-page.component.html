<main class="login-shell" aria-labelledby="page-title">
  <section class="login-panel">
    <p class="eyebrow">Arquitectura - Veterinaria</p>
    <h1 id="page-title">Administración SaaS</h1>
    <p class="context">Acceso global limitado a la administración autorizada de organizaciones.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="saas-email">Correo administrativo</label>
      <input id="saas-email" type="email" autocomplete="username" formControlName="email"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid ? 'true' : null" />
      <small role="alert" *ngIf="form.controls.email.touched && form.controls.email.invalid">Ingresa un correo válido.</small>

      <label for="saas-password">Contraseña</label>
      <input id="saas-password" type="password" autocomplete="current-password" formControlName="password"
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid ? 'true' : null" />
      <small role="alert" *ngIf="form.controls.password.touched && form.controls.password.invalid">Ingresa tu contraseña.</small>

      <p class="error" role="alert" *ngIf="error()">{{ error() }}</p>
      <button type="submit" [disabled]="submitting()">{{ submitting() ? 'Validando acceso…' : 'Ingresar a administración' }}</button>
    </form>

    <nav aria-label="Cambiar acceso"><a routerLink="/login/veterinaria-aurora">Volver al acceso de veterinaria</a></nav>
  </section>
</main>
