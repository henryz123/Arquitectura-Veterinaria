openapi: 3.1.0
info:
  title: Arquitectura - Veterinaria API
  version: 0.1.0-g4-i01
  description: |
    Contrato de las rutas B01 implementadas y verificadas en G4-I01. Los bloques
    B02-B06 continúan en la especificación funcional V1 y no se representan aquí
    como endpoints implementados. Todo dato de demostración es sintético.
servers:
  - url: https://demo.invalid
    description: Marcador de una URL aún no desplegada.
tags:
  - name: authentication
  - name: tenant-administration
paths:
  /api/v1/auth/tenants/{tenantSlug}/staff-sessions:
    post:
      tags: [authentication]
      summary: Inicia una sesión STAFF para el tenant solicitado
      x-implementation-status: implemented-g4-i01
      x-v1-requirements: [RF-AUT-01, RF-AUT-04, RF-AUT-05, RF-AUT-10]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody: { $ref: '#/components/requestBodies/LoginRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/tenants/{tenantSlug}/client-sessions:
    post:
      tags: [authentication]
      summary: Inicia una sesión CLIENT para el tenant solicitado
      x-implementation-status: implemented-g4-i01
      x-v1-requirements: [RF-CLI-01, RF-CLI-02, RF-CLI-03, RF-CLI-04]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody: { $ref: '#/components/requestBodies/LoginRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/saas-sessions:
    post:
      tags: [authentication]
      summary: Inicia una sesión administrativa SaaS sin contexto tenant
      x-implementation-status: implemented-g4-i01
      requestBody: { $ref: '#/components/requestBodies/LoginRequest' }
      responses:
        '201': { $ref: '#/components/responses/SessionCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/session:
    delete:
      tags: [authentication]
      summary: Revoca la sesión actual
      x-implementation-status: implemented-g4-i01
      x-v1-requirements: [RF-AUT-02, RF-AUT-13]
      security: [{ sessionCookie: [], csrfToken: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
  /api/v1/session-context:
    get:
      tags: [authentication]
      summary: Consulta el contexto mínimo de la sesión actual
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/SessionContextResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/tenant-profile/{tenantSlug}:
    get:
      tags: [tenant-administration]
      summary: Consulta el perfil del tenant propio
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      responses:
        '200': { $ref: '#/components/responses/TenantProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tenant-registrations:
    post:
      tags: [tenant-administration]
      summary: Registra una solicitud de veterinaria
      x-implementation-status: implemented-g4-i01
      x-v1-requirements: [RF-SAA-01, RF-SAA-02, RF-SAA-09, RF-SAA-11]
      requestBody: { $ref: '#/components/requestBodies/TenantRegistrationRequest' }
      responses:
        '201': { $ref: '#/components/responses/RegistrationCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tenant-registrations/{registrationId}/resumptions:
    post:
      tags: [tenant-administration]
      summary: Reanuda una solicitud de veterinaria pendiente
      x-implementation-status: implemented-g4-i01
      parameters: [{ $ref: '#/components/parameters/RegistrationId' }]
      requestBody: { $ref: '#/components/requestBodies/RegistrationResumptionRequest' }
      responses:
        '202': { $ref: '#/components/responses/RegistrationAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/email-verifications:
    post:
      tags: [authentication]
      summary: Consume un enlace opaco de verificación de correo
      x-implementation-status: implemented-g4-i01
      requestBody: { $ref: '#/components/requestBodies/OneTimeTokenRequest' }
      responses:
        '200': { $ref: '#/components/responses/VerificationCompleted' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tenant-registrations/{registrationId}/initial-password:
    post:
      tags: [tenant-administration]
      summary: Define la contraseña inicial tras verificar el correo de registro
      x-implementation-status: implemented-g4-i01
      security: [{ registrationGrantCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/RegistrationId' }]
      requestBody: { $ref: '#/components/requestBodies/PasswordRequest' }
      responses:
        '201': { $ref: '#/components/responses/TenantActivated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tenants/{tenantSlug}/client-registrations:
    post:
      tags: [tenant-administration]
      summary: Solicita el registro CLIENT para una veterinaria activa
      x-implementation-status: implemented-g4-i01
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody: { $ref: '#/components/requestBodies/ClientRegistrationRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tenants/{tenantSlug}/client-verification-resends:
    post:
      tags: [tenant-administration]
      summary: Reemite un enlace de verificación CLIENT sin revelar cuentas
      x-implementation-status: implemented-g4-i01
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody: { $ref: '#/components/requestBodies/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/password-recovery-requests:
    post:
      tags: [authentication]
      summary: Solicita un enlace opaco de recuperación de contraseña
      x-implementation-status: implemented-g4-i01
      requestBody: { $ref: '#/components/requestBodies/PasswordRecoveryRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/password-recoveries:
    post:
      tags: [authentication]
      summary: Consume un enlace de recuperación y define una nueva contraseña
      x-implementation-status: implemented-g4-i01
      requestBody: { $ref: '#/components/requestBodies/RecoveryCompletionRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/staff-accounts:
    get:
      tags: [tenant-administration]
      summary: Lista las cuentas STAFF del tenant de la sesión autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/StaffAccounts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/staff-invitations:
    post:
      tags: [tenant-administration]
      summary: Invita una cuenta STAFF con roles explícitos
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/StaffInvitationRequest' }
      responses:
        '201': { $ref: '#/components/responses/StaffInvitationCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/staff-invitations/acceptance:
    post:
      tags: [tenant-administration]
      summary: Acepta una invitación STAFF mediante enlace opaco
      x-implementation-status: implemented-g4-i01
      requestBody: { $ref: '#/components/requestBodies/RecoveryCompletionRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/staff-accounts/{principalId}/roles:
    patch:
      tags: [tenant-administration]
      summary: Reemplaza los roles de una cuenta STAFF del mismo tenant
      x-implementation-status: blocked-by-v004-sql-defect
      x-known-blocker: V004 replace_staff_roles has an ambiguous normalized_email output reference; an audited new migration is required.
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PrincipalId' }]
      requestBody: { $ref: '#/components/requestBodies/StaffRolesRequest' }
      responses:
        '200': { $ref: '#/components/responses/StaffAccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/staff-accounts/{principalId}/deactivations:
    post:
      tags: [tenant-administration]
      summary: Desactiva una cuenta STAFF del mismo tenant
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/PrincipalId' }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tenants:
    get:
      tags: [tenant-administration]
      summary: Lista organizaciones para una sesión SaaS autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/Organizations' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/tenants/{tenantId}/suspensions:
    post:
      tags: [tenant-administration]
      summary: Suspende una organización mediante sesión SaaS autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody: { $ref: '#/components/requestBodies/TenantStatusChangeRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tenants/{tenantId}/reactivations:
    post:
      tags: [tenant-administration]
      summary: Reactiva una organización mediante sesión SaaS autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody: { $ref: '#/components/requestBodies/TenantStatusChangeRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/ruc-reviews:
    post:
      tags: [tenant-administration]
      summary: Solicita la revisión de un RUC sin requerir sesión
      x-implementation-status: implemented-g4-i01
      requestBody: { $ref: '#/components/requestBodies/RucReviewRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [tenant-administration]
      summary: Lista revisiones de RUC para una sesión SaaS autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/RucReviews' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/ruc-reviews/{reviewId}:
    patch:
      tags: [tenant-administration]
      summary: Resuelve una revisión de RUC con sesión SaaS autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/ReviewId' }]
      requestBody: { $ref: '#/components/requestBodies/RucReviewResolutionRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tenants/{tenantSlug}/administrative-recoveries:
    post:
      tags: [tenant-administration]
      summary: Solicita recuperación administrativa sin requerir sesión
      x-implementation-status: implemented-g4-i01
      parameters: [{ $ref: '#/components/parameters/TenantSlug' }]
      requestBody: { $ref: '#/components/requestBodies/AdministrativeRecoveryRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/administrative-recoveries:
    get:
      tags: [tenant-administration]
      summary: Lista recuperaciones administrativas para una sesión SaaS autorizada
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/AdministrativeRecoveries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/administrative-recoveries/{recoveryId}:
    patch:
      tags: [tenant-administration]
      summary: Revisa una recuperación administrativa mediante sesión SaaS
      x-implementation-status: blocked-by-v005-sql-defect
      x-known-blocker: V005 review_administrative_recovery_for_session has an ambiguous principal_id output reference; an audited new migration is required.
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/RecoveryId' }]
      requestBody: { $ref: '#/components/requestBodies/AdministrativeRecoveryReviewRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/client-space:
    get:
      tags: [tenant-administration]
      summary: Consulta el espacio mínimo de una sesión CLIENT
      x-implementation-status: implemented-g4-i01
      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/ClientSpaceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: AV_SESSION }
    registrationGrantCookie: { type: apiKey, in: cookie, name: AV_REGISTRATION_GRANT }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token }
  parameters:
    TenantSlug:
      name: tenantSlug
      in: path
      required: true
      description: Selector de contexto o recurso; nunca concede autoridad por sí mismo.
      schema: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    TenantId: { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
    RegistrationId: { name: registrationId, in: path, required: true, schema: { type: string, format: uuid } }
    PrincipalId: { name: principalId, in: path, required: true, schema: { type: string, format: uuid } }
    ReviewId: { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
    RecoveryId: { name: recoveryId, in: path, required: true, schema: { type: string, format: uuid } }
  requestBodies:
    LoginRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
    TenantRegistrationRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenantRegistrationRequest' } } } }
    RegistrationResumptionRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationResumptionRequest' } } } }
    OneTimeTokenRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OneTimeTokenRequest' } } } }
    PasswordRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordRequest' } } } }
    ClientRegistrationRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientRegistrationRequest' } } } }
    EmailRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
    PasswordRecoveryRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordRecoveryRequest' } } } }
    RecoveryCompletionRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCompletionRequest' } } } }
    StaffInvitationRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StaffInvitationRequest' } } } }
    StaffRolesRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StaffRolesRequest' } } } }
    TenantStatusChangeRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenantStatusChangeRequest' } } } }
    RucReviewRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RucReviewRequest' } } } }
    RucReviewResolutionRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RucReviewResolutionRequest' } } } }
    AdministrativeRecoveryRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdministrativeRecoveryRequest' } } } }
    AdministrativeRecoveryReviewRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdministrativeRecoveryReviewRequest' } } } }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, writeOnly: true }
    TenantProfile:
      type: object
      required: [slug, commercialName, status]
      properties:
        slug: { type: string }
        commercialName: { type: string }
        status: { type: string }
    SessionContext:
      type: object
      required: [accountType, tenant, roles]
      properties:
        accountType: { type: string, enum: [SAAS, STAFF, CLIENT] }
        tenant:
          oneOf:
            - $ref: '#/components/schemas/TenantProfile'
            - type: 'null'
        roles: { type: array, items: { type: string } }
    LoginResult:
      type: object
      required: [csrfToken, context]
      properties:
        csrfToken: { type: string, description: Token anti-CSRF ligado a la sesión y entregado solo en la respuesta de inicio. }
        context: { $ref: '#/components/schemas/SessionContext' }
    TenantRegistrationRequest:
      type: object
      required: [commercialName, commercialAddress, commercialPhone, commercialEmail, initialAdministratorEmail]
      properties:
        commercialName: { type: string, minLength: 2, maxLength: 160 }
        commercialAddress: { type: string, minLength: 3, maxLength: 240 }
        commercialPhone: { type: string, minLength: 5, maxLength: 40 }
        commercialEmail: { type: string, format: email }
        initialAdministratorEmail: { type: string, format: email }
        ruc: { type: string }
    RegistrationResumptionRequest:
      type: object
      required: [initialAdministratorEmail]
      properties: { initialAdministratorEmail: { type: string, format: email } }
    OneTimeTokenRequest:
      type: object
      required: [token]
      properties: { token: { type: string, writeOnly: true } }
    PasswordRequest:
      type: object
      required: [password]
      properties: { password: { type: string, format: password, writeOnly: true } }
    ClientRegistrationRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, writeOnly: true }
    EmailRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    PasswordRecoveryRequest:
      type: object
      required: [accountType, email]
      properties:
        accountType: { type: string, enum: [SAAS, STAFF, CLIENT] }
        tenantSlug: { type: [string, 'null'], description: Requerido por el flujo STAFF o CLIENT según la regla de negocio. }
        email: { type: string, format: email }
    RecoveryCompletionRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, writeOnly: true }
        password: { type: string, format: password, writeOnly: true }
    StaffInvitationRequest:
      type: object
      required: [email, roles]
      properties:
        email: { type: string, format: email }
        roles: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    StaffRolesRequest:
      type: object
      required: [roles]
      properties: { roles: { type: array, minItems: 1, items: { type: string, minLength: 1 } } }
    TenantStatusChangeRequest:
      type: object
      required: [reason, confirmed]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        confirmed: { type: boolean }
    RucReviewRequest:
      type: object
      required: [ruc, requesterEmail, contactChannel, reason]
      properties:
        ruc: { type: string }
        requesterEmail: { type: string, format: email }
        contactChannel: { type: string, minLength: 3, maxLength: 254 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    RucReviewResolutionRequest:
      type: object
      required: [status, reason, releaseRuc, confirmed]
      properties:
        status: { type: string }
        reason: { type: string, minLength: 3, maxLength: 500 }
        releaseRuc: { type: boolean }
        confirmed: { type: boolean }
    AdministrativeRecoveryRequest:
      type: object
      required: [applicantEmail, evidenceReference]
      properties:
        applicantEmail: { type: string, format: email }
        evidenceReference: { type: string, minLength: 3, maxLength: 300 }
    AdministrativeRecoveryReviewRequest:
      type: object
      required: [status, reason, legitimacyChecked]
      properties:
        status: { type: string }
        reason: { type: string, minLength: 3, maxLength: 500 }
        legitimacyChecked: { type: boolean }
    VerificationStatus:
      type: object
      required: [status, accountType, relatedId]
      properties:
        status: { type: string }
        accountType: { type: string, enum: [SAAS, STAFF, CLIENT] }
        relatedId: { type: string, format: uuid }
    RegistrationResult:
      type: object
      required: [registrationId, status]
      properties:
        registrationId: { type: string, format: uuid }
        status: { type: string }
        rucReservedUntil: { type: [string, 'null'], format: date-time }
