      security: [{ sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/PosSalesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [inventory]
      summary: Prepara una venta idempotente con instantaneas de producto y precio
      x-implementation-status: implemented-b04-pos
      x-v1-requirements: [RF-B04-004, RF-B04-007, RF-B04-008, RF-B04-014]
      security: [{ sessionCookie: [], csrfToken: [] }]
      requestBody: { $ref: '#/components/requestBodies/PosSaleRequest' }
      responses:
        '201': { $ref: '#/components/responses/PosSaleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/pos/sales/{saleId}:
    get:
      tags: [inventory]
      summary: Consulta el comprobante interno de una venta tenant-local
      x-implementation-status: implemented-b04-pos
      x-v1-requirements: [RF-B04-004, RF-B04-006, RF-B04-007, RF-B04-014]
      security: [{ sessionCookie: [] }]
      parameters: [{ name: saleId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { $ref: '#/components/responses/PosSaleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/pos/sales/{saleId}/confirmations:
    post:
      tags: [inventory]
      summary: Confirma una venta y descuenta el stock una sola vez en una transaccion
      x-implementation-status: implemented-b04-pos
      x-v1-requirements: [RF-B04-002, RF-B04-004, RF-B04-005, RF-B04-006, RF-B04-007, RF-B04-008, RF-B04-009, RF-B04-014]
      security: [{ sessionCookie: [], csrfToken: [] }]
      parameters: [{ name: saleId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { $ref: '#/components/requestBodies/PosSaleConfirmationRequest' }
      responses:
        '200': { $ref: '#/components/responses/PosSaleResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/CsrfOrForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: AV_SESSION }
    registrationGrantCookie: { type: apiKey, in: cookie, name: AV_REGISTRATION_GRANT }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-Token }
  parameters:
    TenantSlug:
      name: tenantSlug
      in: path
      required: true
      description: Selector de contexto o recurso; nunca concede autoridad por sí mismo.
      schema: { type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    TenantId: { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
    RegistrationId: { name: registrationId, in: path, required: true, schema: { type: string, format: uuid } }
    PrincipalId: { name: principalId, in: path, required: true, schema: { type: string, format: uuid } }
    ReviewId: { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
    RecoveryId: { name: recoveryId, in: path, required: true, schema: { type: string, format: uuid } }
    OwnerId: { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
    PetId: { name: petId, in: path, required: true, schema: { type: string, format: uuid } }
    ClientOwnerLinkRequestId: { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
    ClinicalEpisodeId: { name: episodeId, in: path, required: true, schema: { type: string, format: uuid } }
  requestBodies:
    LoginRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
    TenantRegistrationRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenantRegistrationRequest' } } } }
    RegistrationResumptionRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationResumptionRequest' } } } }
    OneTimeTokenRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OneTimeTokenRequest' } } } }
    PasswordRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordRequest' } } } }
    ClientRegistrationRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientRegistrationRequest' } } } }
    EmailRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
    PasswordRecoveryRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordRecoveryRequest' } } } }
    RecoveryCompletionRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCompletionRequest' } } } }
    StaffInvitationRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StaffInvitationRequest' } } } }
    StaffRolesRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StaffRolesRequest' } } } }
    TenantStatusChangeRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TenantStatusChangeRequest' } } } }
    RucReviewRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RucReviewRequest' } } } }
    RucReviewResolutionRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RucReviewResolutionRequest' } } } }
    AdministrativeRecoveryRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdministrativeRecoveryRequest' } } } }
    AdministrativeRecoveryReviewRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdministrativeRecoveryReviewRequest' } } } }
    OwnerRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerRequest' } } } }
    PetRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PetRequest' } } } }
    OwnershipTransferRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OwnershipTransferRequest' } } } }
    DuplicateReviewRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DuplicateReviewRequest' } } } }
    DuplicateResolutionRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DuplicateResolutionRequest' } } } }
    ClientOwnerLinkResolutionRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientOwnerLinkResolutionRequest' } } } }
    ClinicalEpisodeRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClinicalEpisodeRequest' } } } }
    VaccinationRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VaccinationRequest' } } } }
    PrescriptionRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PrescriptionRequest' } } } }
    AmendmentRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AmendmentRequest' } } } }
    CatalogCategoryRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogCategoryRequest' } } } }
    CatalogProductRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogProductRequest' } } } }
    StockAdjustmentRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockAdjustmentRequest' } } } }
    PosSaleRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PosSaleRequest' } } } }
    PosSaleConfirmationRequest: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PosSaleConfirmationRequest' } } } }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, writeOnly: true }
    TenantProfile:
      type: object
      required: [slug, commercialName, status]
      properties:
        slug: { type: string }
        commercialName: { type: string }
        status: { type: string }
    SessionContext:
      type: object
      required: [accountType, tenant, roles]
      properties:
        accountType: { type: string, enum: [SAAS, STAFF, CLIENT] }
        tenant:
          oneOf:
            - $ref: '#/components/schemas/TenantProfile'
            - type: 'null'
        roles: { type: array, items: { type: string } }
    LoginResult:
      type: object
      required: [csrfToken, context]
      properties:
        csrfToken: { type: string, description: Token anti-CSRF ligado a la sesión y entregado solo en la respuesta de inicio. }
        context: { $ref: '#/components/schemas/SessionContext' }
    CsrfToken:
      type: object
      required: [csrfToken]
      properties:
        csrfToken: { type: string, description: Token anti-CSRF opaco entregado solo a la sesión vigente durante el bootstrap same-origin. }
    TenantRegistrationRequest:
      type: object
      required: [commercialName, commercialAddress, commercialPhone, commercialEmail, initialAdministratorEmail]
      properties:
        commercialName: { type: string, minLength: 2, maxLength: 160 }
        commercialAddress: { type: string, minLength: 3, maxLength: 240 }
        commercialPhone: { type: string, minLength: 5, maxLength: 40 }
        commercialEmail: { type: string, format: email }
        initialAdministratorEmail: { type: string, format: email }
        ruc: { type: string }
    RegistrationResumptionRequest:
      type: object
      required: [initialAdministratorEmail]
      properties: { initialAdministratorEmail: { type: string, format: email } }
    OneTimeTokenRequest:
      type: object
      required: [token]
      properties: { token: { type: string, writeOnly: true } }
    PasswordRequest:
      type: object
      required: [password]
      properties: { password: { type: string, format: password, writeOnly: true } }
    ClientRegistrationRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, writeOnly: true }
    EmailRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    PasswordRecoveryRequest:
      type: object
      required: [accountType, email]
      properties:
        accountType: { type: string, enum: [SAAS, STAFF, CLIENT] }
        tenantSlug: { type: [string, 'null'], description: Requerido por el flujo STAFF o CLIENT según la regla de negocio. }
        email: { type: string, format: email }
    RecoveryCompletionRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, writeOnly: true }
        password: { type: string, format: password, writeOnly: true }
    StaffInvitationRequest:
      type: object
      required: [email, roles]
      properties:
        email: { type: string, format: email }
        roles: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
    StaffRolesRequest:
      type: object
      required: [roles]
      properties: { roles: { type: array, minItems: 1, items: { type: string, minLength: 1 } } }
    TenantStatusChangeRequest:
      type: object
      required: [reason, confirmed]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        confirmed: { type: boolean }
    RucReviewRequest:
      type: object
      required: [ruc, requesterEmail, contactChannel, reason]
      properties:
        ruc: { type: string }
        requesterEmail: { type: string, format: email }
        contactChannel: { type: string, minLength: 3, maxLength: 254 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    RucReviewResolutionRequest:
      type: object
      required: [status, reason, releaseRuc, confirmed]
      properties:
        status: { type: string }
        reason: { type: string, minLength: 3, maxLength: 500 }
        releaseRuc: { type: boolean }
        confirmed: { type: boolean }
    AdministrativeRecoveryRequest:
      type: object
      required: [applicantEmail, evidenceReference]
      properties:
        applicantEmail: { type: string, format: email }
        evidenceReference: { type: string, minLength: 3, maxLength: 300 }
    AdministrativeRecoveryReviewRequest:
      type: object
      required: [status, reason, legitimacyChecked]
      properties:
        status: { type: string }
        reason: { type: string, minLength: 3, maxLength: 500 }
        legitimacyChecked: { type: boolean }
    VerificationStatus:
      type: object
      required: [status, accountType, relatedId]
      properties:
        status: { type: string }
        accountType: { type: string, enum: [SAAS, STAFF, CLIENT] }
        relatedId: { type: string, format: uuid }
    RegistrationResult:
      type: object
      required: [registrationId, status]
      properties:
        registrationId: { type: string, format: uuid }
        status: { type: string }
        rucReservedUntil: { type: [string, 'null'], format: date-time }
    ActivationResult:
      type: object
      required: [tenantId, tenantSlug, commercialName]
      properties:
        tenantId: { type: string, format: uuid }
        tenantSlug: { type: string }
        commercialName: { type: string }
    StaffInvitationResult:
      type: object
      required: [principalId, status, roles]
      properties:
        principalId: { type: string, format: uuid }
        status: { type: string }
        roles: { type: array, items: { type: string } }
    StaffAccountView:
      type: object
      required: [principalId, email, status, roles]
      properties:
        principalId: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string }
        roles: { type: array, items: { type: string } }
    Organization:
      type: object
      required: [id, commercialName, ruc, commercialAddress, commercialPhone, commercialEmail, registeredAt, status]
      properties:
        id: { type: string, format: uuid }
        commercialName: { type: string }
        ruc: { type: string }
        commercialAddress: { type: string }
        commercialPhone: { type: string }
        commercialEmail: { type: string, format: email }
        registeredAt: { type: string, format: date-time }
        status: { type: string }
    RucReview:
      type: object
      required: [id, ruc, requesterEmail, normalizedRequesterEmail, contactChannel, requestReason, status]
      properties:
        id: { type: string, format: uuid }
        ruc: { type: string }
        requesterEmail: { type: string, format: email }
        normalizedRequesterEmail: { type: string, format: email }
        contactChannel: { type: string }
        requestReason: { type: string }
        status: { type: string }
        resolutionReason: { type: [string, 'null'] }
        resolvedByPrincipalId: { type: [string, 'null'], format: uuid }
        resolvedAt: { type: [string, 'null'], format: date-time }
        affectedTenantId: { type: [string, 'null'], format: uuid }
    AdministrativeRecovery:
      type: object
      required: [id, tenantId, applicantEmail, normalizedApplicantEmail, evidenceReference, status]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        applicantEmail: { type: string, format: email }
        normalizedApplicantEmail: { type: string, format: email }
        evidenceReference: { type: string }
        status: { type: string }
        decisionReason: { type: [string, 'null'] }
        reviewedByPrincipalId: { type: [string, 'null'], format: uuid }
        reviewedAt: { type: [string, 'null'], format: date-time }
    ClientSpace:
      type: object
      required: [tenantSlug, commercialName, message]
      properties:
        tenantSlug: { type: string }
        commercialName: { type: string }
        message: { type: string }
    ClientOwnerLinkStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [SIN_SOLICITUD, PENDIENTE, APROBADA, RECHAZADA] }
        requestReference: { type: [string, 'null'] }
        requestedAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        rejectionReason: { type: [string, 'null'] }
    ClientOwnerLinkRequest:
      type: object
      required: [id, tenantId, requestReference, clientPrincipalId, status, requestedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        requestReference: { type: string }
        clientPrincipalId: { type: string, format: uuid, description: Identificador interno visible solo a personal autorizado. }
        status: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA] }
        proposedOwnerId: { type: [string, 'null'], format: uuid }
        verificationMethod: { type: [string, 'null'] }
        rejectionReason: { type: [string, 'null'] }
        requestedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedByPrincipalId: { type: [string, 'null'], format: uuid }
    ClientOwnerLinkResolutionRequest:
      type: object
      required: [status, verificationMethod, identityVerified]
      properties:
        status: { type: string, enum: [APROBADA, RECHAZADA] }
        ownerId: { type: [string, 'null'], format: uuid, description: Obligatorio cuando status es APROBADA. }
        verificationMethod: { type: string, minLength: 3, maxLength: 120, description: Método general; no contiene copias de documentos. }
        rejectionReason: { type: [string, 'null'], maxLength: 500, description: Obligatorio cuando status es RECHAZADA. }
        identityVerified: { type: boolean, const: true }
    ClientPetProfile:
      type: object
      required: [id, name, species, sex, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        species: { type: string }
        breed: { type: [string, 'null'] }
        sex: { type: string, enum: [HEMBRA, MACHO, DESCONOCIDO] }
        birthDate: { type: [string, 'null'], format: date }
        estimatedAgeMonths: { type: [integer, 'null'] }
        distinguishingMarks: { type: [string, 'null'] }
        status: { type: string, enum: [ACTIVA, FALLECIDA, INACTIVA] }
    OwnerRequest:
      type: object
      required: [givenNames, familyNames]
      properties:
        givenNames: { type: string, minLength: 1, maxLength: 120 }
        familyNames: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: [string, 'null'], maxLength: 40 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        address: { type: [string, 'null'], maxLength: 240 }
    PetRequest:
      type: object
      required: [name, species]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        species: { type: string, minLength: 1, maxLength: 80 }
        breed: { type: [string, 'null'], maxLength: 120 }
        sex: { type: [string, 'null'], enum: [HEMBRA, MACHO, DESCONOCIDO] }
        birthDate: { type: [string, 'null'], format: date }
        estimatedAgeMonths: { type: [integer, 'null'], minimum: 0, maximum: 480 }
        distinguishingMarks: { type: [string, 'null'], maxLength: 500 }
    ClinicalEpisodeRequest:
      type: object
      properties:
        appointmentId: { type: [string, 'null'], format: uuid }
        reason: { type: [string, 'null'], maxLength: 4000 }
        anamnesis: { type: [string, 'null'], maxLength: 12000 }
        assessment: { type: [string, 'null'], maxLength: 12000 }
        diagnosis: { type: [string, 'null'], maxLength: 4000 }
        treatmentPlan: { type: [string, 'null'], maxLength: 12000 }
        observations: { type: [string, 'null'], maxLength: 12000 }
    VaccinationRequest:
      type: object
      required: [operationId, vaccineName, administeredOn]
      properties:
        episodeId: { type: [string, 'null'], format: uuid }
        operationId: { type: string, format: uuid, description: Identificador estable para reintentos idempotentes de la misma vacuna. }
        vaccineName: { type: string, minLength: 1, maxLength: 240 }
        administeredOn: { type: string, format: date }
        dose: { type: [string, 'null'], maxLength: 240 }
        batchCode: { type: [string, 'null'], maxLength: 240 }
        nextDueOn: { type: [string, 'null'], format: date, description: No puede ser anterior a administeredOn. }
    PrescriptionRequest:
      type: object
      required: [medication, presentation, dose, route, frequency, duration, instructions, prescribedOn]
      properties:
        medication: { type: string, minLength: 1, maxLength: 500 }
        presentation: { type: string, minLength: 1, maxLength: 500 }
        dose: { type: string, minLength: 1, maxLength: 500 }
        route: { type: string, minLength: 1, maxLength: 240 }
        frequency: { type: string, minLength: 1, maxLength: 240 }
        duration: { type: string, minLength: 1, maxLength: 240 }
        instructions: { type: string, minLength: 1, maxLength: 12000 }
        prescribedOn: { type: string, format: date }
    AmendmentRequest:
      type: object
      required: [reason, addendum]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
        addendum: { type: string, minLength: 1, maxLength: 12000 }
    OwnershipTransferRequest:
      type: object
      required: [expectedOwnerId, newOwnerId, reason, identityVerified]
      properties:
        expectedOwnerId: { type: string, format: uuid }
        newOwnerId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
        identityVerified: { type: boolean, const: true }
    DuplicateReviewRequest:
      type: object
      required: [duplicateId, referenceId]
      properties:
        duplicateId: { type: string, format: uuid }
        referenceId: { type: string, format: uuid }
    DuplicateResolutionRequest:
      type: object
